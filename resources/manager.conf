# Defaults of the programs beside Eclipse (eclipse-batch, eclipse-info, eclipse-services).
# Edited with the Configuration Editor (eclipse-config). What a command line says comes first;
# for the database, Preferences > General comes before this file.

[database]
# The scene database's folder, when Preferences > General has none and no -dbroot is given.
root =

[batch]
# The pictures eclipse-batch renders: their format, and the digits of the frame number.
format = png
digits = 4
# Frames rendered at once (0: Preferences > Render).
threads = 0

[services]
# Where the Service Launcher looks for the services' programs (empty: the programs' own folder).
location =
