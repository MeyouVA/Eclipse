# Vectorization styles for eclipse-convert (picture.png drawing.ecd -vectorize -style <name>), beside those
# Eclipse has. A style is a name, then its options; eclipse-convert -styles lists them all.

Clean Line Art = -thresh 0.45 -rmv_dirt 4 -fit_errorl 0.8 -smoothl 2
Rough Pencil = -pencil -thresh 0.6 -rmv_dirt 2
Flat Colour Cards = -color_vectorize -rmv_dirt 6 -fit_errorc 2.0
